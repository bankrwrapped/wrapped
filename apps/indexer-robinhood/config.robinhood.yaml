# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Robinhood Chain (4663) indexer: Bankr's Doppler launches. Separate from
# apps/indexer (Base) on purpose - its own database and deploy. Same
# Doppler handlers as Base minus Clanker (not deployed on Robinhood).
# config.robinhood.yaml is a copy kept for `envio dev --config` habits;
# config.yaml is what `envio dev`/`envio start` read.
#
# HyperSync serves chain 4663 (https://4663.hypersync.xyz), so this runs
# with ENVIO_API_TOKEN like Base; no RPC needed.

name: bankr-wrapped-robinhood-indexer

contracts:
  - name: Airlock
    handler: src/EventHandlers.ts
    events:
      - event: "Create(address asset, address indexed numeraire, address initializer, address poolOrHook)"
        name: Create
        field_selection:
          transaction_fields:
            - hash

  - name: PoolManager
    handler: src/EventHandlers.ts
    events:
      - event: "Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)"
        name: Initialize
      - event: "Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee)"
        name: Swap
        field_selection:
          transaction_fields:
            - hash

  # Doppler fee events, from ANY contract (wildcard - see the handler).
  # Every Doppler fee holder emits the same FeesManager events:
  # StreamableFeesLockerV2 (migrated pools), the pool's initializer
  # (DopplerHookInitializer, multicurve initializers) and Rehype hook
  # initializers - Doppler ships a new Rehype version every few weeks, and
  # recent Bankr launches (Robinhood since July 2026, Base too) pay creators
  # from those, never from the locker. The handler only accepts an event
  # whose emitter is that launch's own fee holder.
  - name: DopplerFees
    handler: src/EventHandlers.ts
    events:
      - event: "Collect(bytes32 indexed poolId, uint256 fees0, uint256 fees1)"
        name: Collect
        field_selection:
          transaction_fields:
            - hash
      - event: "Release(bytes32 indexed poolId, address indexed beneficiary, uint256 fees0, uint256 fees1)"
        name: Release
        field_selection:
          transaction_fields:
            - hash
      # A Rehype hook sets the pool's fee schedule inside the launch's own
      # Airlock.create tx - how a launch's genuine hook is identified.
      - event: "FeeScheduleSet(bytes32 indexed poolId, uint32 startingTime, uint24 startFee, uint24 endFee, uint32 durationSeconds)"
        name: FeeScheduleSet
        field_selection:
          transaction_fields:
            - hash
      # A hook attached later by the pool's authority, emitted by the initializer.
      - event: "SetDopplerHook(address indexed asset, address indexed dopplerHook)"
        name: SetDopplerHook
        field_selection:
          transaction_fields:
            - hash

chains:
  - id: 4663 # Robinhood Chain mainnet
    start_block: 646829
    contracts:
      - name: Airlock
        address:
          - "0xeb7c034704ef8dcd2d32324c1545f62fb4ad0862"
      - name: PoolManager
        address:
          - "0x8366a39CC670B4001A1121B8F6A443A643e40951"
      # Wildcard: no address. The fee locker (0x7b6147ac...) is trusted in
      # src/EventHandlers.ts (DOPPLER_FEE_LOCKERS).
      - name: DopplerFees
