# Module 2 entity schema — Envio's own database.
#
# RESOLVED 2026-08-07 (playbook update): Envio and apps/api are two SEPARATE
# Postgres instances. Envio owns this schema; apps/api owns only
# indexed_contracts/indexed_tokens/token_volume_summary/price_cache in its
# own DB (Module 6). Data flows one direction only: Envio -> apps/api via
# Module 9's sync job.
#
# RESOLVED 2026-08-07 (OQ10/OQ11): pool discovery is self-contained via
# Airlock.Create + PoolManager.Initialize, filtered globally in handler logic
# — no apps/api allow-list, no contractRegister (PoolManager is a singleton,
# not a per-pool factory-deployed contract, so there's nothing to register).
#
# KnownHook (renamed from KnownAsset this revision): matches Doppler's
# design more directly — poolOrHook from Airlock.Create is each launch's
# freshly-deployed, per-pool-unique hook instance, confirmed from
# UniswapV4Initializer.sol (`hooks: IHooks(doppler)`). Matching
# PoolManager.Initialize's `hooks` field against this table is a single
# direct lookup, vs. the previous revision's two-sided currency0/currency1
# match against a KnownAsset(tokenAddress) table — functionally similar but
# this is what the playbook's resolved OQ11 design recommends and is closer
# to Doppler's actual per-launch identity model.

type KnownHook {
  id: ID! # `${chain}:${hookAddress}`
  chain: String!
  hookAddress: String!
  tokenAddress: String! # the launched asset, from Airlock.Create's `asset` field
  source: String! # 'doppler' (Clanker is Module 4's scope)
}

type WatchedPool {
  id: ID! # `${chain}:${poolId}`
  chain: String!
  poolId: String!
  tokenAddress: String!
  tokenIsToken0: Boolean! # known at creation time from Initialize's currency0/currency1 — no RPC call needed
}

type IndexedSwap {
  id: ID! # `${chain}:${txHash}:${logIndex}`
  chain: String!
  poolId: String!
  tokenAddress: String!
  blockNumber: BigInt!
  txHash: String!
  logIndex: Int!
  timestamp: Timestamp!
  amountToken: BigInt! # abs(amount0 or amount1), whichever side is the launched token, per tokenIsToken0
  amountUsd: BigDecimal # left NULL — pricing is Module 5's job, done downstream via Envio's GraphQL API
}

type IndexedFeeEvent {
  id: ID! # `${chain}:${txHash}:${logIndex}`
  chain: String!
  poolId: String!
  tokenAddress: String!
  eventType: String! # 'Collect' | 'Release' | 'Lock' | 'Unlock' | 'UpdateBeneficiary'
  recipient: String # beneficiary (Release), recipient (Unlock), newBeneficiary (UpdateBeneficiary); null for Collect/Lock
  amountToken0: BigInt
  amountToken1: BigInt
  blockNumber: BigInt!
  txHash: String!
  logIndex: Int!
  timestamp: Timestamp!
}
