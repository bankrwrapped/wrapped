# Module 2 + 4 entity schema — Envio's own database.
#
# RESOLVED 2026-08-07 (playbook update): Envio and apps/api are two SEPARATE
# Postgres instances. Envio owns this schema; apps/api owns only
# indexed_contracts/indexed_tokens/token_volume_summary/price_cache in its
# own DB (Module 6). Data flows one direction only: Envio -> apps/api via
# Module 9's sync job.
#
# RESOLVED 2026-08-07 (OQ10/OQ11): pool discovery is self-contained via
# Airlock.Create + PoolManager.Initialize, filtered globally in handler logic
# — no apps/api allow-list, no contractRegister (PoolManager is a singleton,
# not a per-pool factory-deployed contract, so there's nothing to register).
# Confirmed working in production on Robinhood as of 2026-08-08 (§2 OQ11).
#
# KnownHook: poolOrHook from Airlock.Create is each launch's freshly-deployed,
# per-pool-unique hook instance, confirmed from UniswapV4Initializer.sol
# (`hooks: IHooks(doppler)`). Matching PoolManager.Initialize's `hooks`
# field against this table is a single direct lookup.
type KnownHook {
  id: ID! # `${chain}:${hookAddress}`
  chain: String!
  hookAddress: String!
  tokenAddress: String! # the launched asset, from Airlock.Create's `asset` field
  source: String! # 'doppler' (Clanker confirmed Base-only, not on Robinhood — §2 OQ3 — so this field only ever needs to distinguish doppler here, not clanker, on this chain)
}

# MODULE 4 ADDED, 2026-08-08 — Clanker's KnownHook equivalent, but
# token-keyed rather than hook-keyed: Clanker's TokenCreated already carries
# poolId + pairedToken directly, so there's no separate PoolManager.Initialize
# lookup step the way Doppler's two-step (Airlock.Create -> Initialize) needs.
type KnownToken {
  id: ID! # `${chain}:${tokenAddress}`
  chain: String!
  tokenAddress: String!
  source: String! # 'clanker'
}

type WatchedPool {
  id: ID! # `${chain}:${poolId}`
  chain: String!
  poolId: String!
  tokenAddress: String!
  tokenIsToken0: Boolean! # known at creation time from Initialize's currency0/currency1 (Doppler) or TokenCreated's tokenAddress/pairedToken address ordering (Clanker) — no RPC call needed either way
}

type IndexedSwap {
  id: ID! # `${chain}:${txHash}:${logIndex}`
  chain: String!
  poolId: String!
  tokenAddress: String!
  blockNumber: BigInt!
  txHash: String!
  logIndex: Int!
  timestamp: Timestamp!
  amountToken: BigInt! # abs(amount0 or amount1), whichever side is the launched token, per tokenIsToken0
  amountUsd: BigDecimal # left NULL — pricing is Module 5's job, done downstream via Envio's GraphQL API
}

type IndexedFeeEvent {
  id: ID! # `${chain}:${txHash}:${logIndex}`
  chain: String!
  poolId: String # MODULE 4, 2026-08-08: was String! — now nullable. Doppler's fee events are pool-keyed; Clanker's (StoreTokens/ClaimTokens/ClaimTokensPermissioned) are (feeOwner, token)-keyed, with no poolId at all.
  tokenAddress: String!
  eventType: String! # 'Collect' | 'Release' | 'Lock' | 'Unlock' | 'UpdateBeneficiary' | 'StoreTokens' | 'ClaimTokens' | 'ClaimTokensPermissioned'
  recipient: String # beneficiary (Release), recipient (Unlock), newBeneficiary (UpdateBeneficiary), feeOwner (StoreTokens/ClaimTokens), recipient (ClaimTokensPermissioned); null for Collect/Lock
  amountToken0: BigInt
  amountToken1: BigInt
  blockNumber: BigInt!
  txHash: String!
  logIndex: Int!
  timestamp: Timestamp!
}
