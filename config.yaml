# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
#
# Module 2 + 4 — Base Chain Indexer (Doppler + Clanker)
#
# REWRITTEN 2026-08-08 against Envio V3's real config shape (confirmed
# directly against docs.envio.dev/docs/HyperIndex/multichain-indexing and
# the V3 migration guide, not assumed from Module 3's file alone): top-level
# `contracts:` declares event signatures once; `chains:` assigns addresses
# and start_block per network. `networks:` (this file's own earlier version)
# no longer exists in V3.
#
# BASE-ONLY MERGE, 2026-08-08 — deliberately excludes Robinhood:
#   - Base's start_block is fixed to 28415516 (Airlock's real on-chain
#     deployment block, confirmed by Module 3, 2026-08-07) and Base carries
#     no `skip` flag — a prior draft of this file briefly had `skip: true`
#     and `start_block: 0` on Base, which would have both re-scanned ~28.4M
#     dead blocks and stopped Base syncing entirely; neither is correct.
#   - Robinhood's chain block is NOT included here. Two different copies of
#     it were seen with conflicting `skip`/`start_block` values, and its
#     `rpc:` field could not be confirmed against Module 3's actual current
#     deployment (the ledger itself flags this as still open — see OQ6).
#     Splice in Robinhood's chain entry from Module 3's real, current file
#     once produced — don't carry forward either stale copy here.
#
# MODULE 4 ADDED, 2026-08-08 — Clanker Support, Base-only by definition.
# Confirmed via Bankr's own bot (supersedes an earlier playbook draft that
# had left Robinhood Clanker addresses as "still open"): Clanker has no
# deployed contracts on Robinhood Chain at all — Robinhood launches route
# through Doppler/V4 multicurve exclusively (Module 2/3's territory).
# `Clanker` and `ClankerFeeLocker` addresses below are the real, verified
# Base v4.0.0 deployment (cross-checked against Clanker's own docs page AND
# BaseScan's live verified-contract ABI, not assumed). `ClankerLpLockerFeeConversion`
# is deliberately NOT watched here — it auto-collects LP fees per swap and
# calls storeFees() on ClankerFeeLocker, which is what emits StoreTokens;
# watching the LP locker directly would just duplicate that signal.
#
# NOTE on event_type naming: real Doppler event names, confirmed from
# source (whetstoneresearch/doppler, src/lockers/StreamableFeesLockerV2.sol
# + inherited src/base/FeesManager.sol):
#   Collect(poolId, fees0, fees1)                     -- fees pulled from pool into locker
#   Release(poolId, beneficiary, fees0, fees1)         -- fees paid out to a beneficiary (the real "claim")
#   UpdateBeneficiary(poolId, oldBeneficiary, newBeneficiary)
#   Lock(poolId, beneficiaries, unlockDate)
#   Unlock(poolId, recipient)
# Real Clanker event names, confirmed from ClankerFeeLocker's verified ABI
# on BaseScan (0xF3622742b1E446D92e45E22923Ef11C2fcD55D68):
#   StoreTokens(sender, feeOwner, token, balance, amount)   -- fee accrual, Clanker's "Collect" equivalent
#   ClaimTokens(feeOwner, token, amountClaimed)             -- real per-feeOwner claim
#   ClaimTokensPermissioned(feeOwner, token, recipient, amountClaimed) -- claim paid to a different recipient than feeOwner

name: bankr-wrapped-base-indexer

contracts:
  - name: Airlock
    handler: src/EventHandlers.ts
    events:
      - event: "Create(address asset, address indexed numeraire, address initializer, address poolOrHook)"
        name: Create

  - name: PoolManager
    handler: src/EventHandlers.ts
    events:
      - event: "Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, uint24 fee, int24 tickSpacing, address hooks, uint160 sqrtPriceX96, int24 tick)"
        name: Initialize
      - event: "Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee)"
        name: Swap
        field_selection:
          transaction_fields:
            - hash

  - name: StreamableFeesLockerV2
    handler: src/EventHandlers.ts
    events:
      - event: "Collect(bytes32 indexed poolId, uint256 fees0, uint256 fees1)"
        name: Collect
        field_selection:
          transaction_fields:
            - hash
      - event: "Release(bytes32 indexed poolId, address indexed beneficiary, uint256 fees0, uint256 fees1)"
        name: Release
        field_selection:
          transaction_fields:
            - hash

  - name: Clanker
    handler: src/EventHandlers.ts
    events:
      - event: "TokenCreated(address msgSender, address indexed tokenAddress, address indexed tokenAdmin, string tokenImage, string tokenName, string tokenSymbol, string tokenMetadata, string tokenContext, int24 startingTick, address poolHook, bytes32 poolId, address pairedToken, address locker, address mevModule, uint256 extensionsSupply, address[] extensions)"
        name: TokenCreated

  - name: ClankerFeeLocker
    handler: src/EventHandlers.ts
    events:
      - event: "StoreTokens(address indexed sender, address indexed feeOwner, address indexed token, uint256 balance, uint256 amount)"
        name: StoreTokens
        field_selection:
          transaction_fields:
            - hash
      - event: "ClaimTokens(address indexed feeOwner, address indexed token, uint256 amountClaimed)"
        name: ClaimTokens
        field_selection:
          transaction_fields:
            - hash
      - event: "ClaimTokensPermissioned(address indexed feeOwner, address indexed token, address recipient, uint256 amountClaimed)"
        name: ClaimTokensPermissioned
        field_selection:
          transaction_fields:
            - hash

chains:
  - id: 8453 # Base mainnet
    start_block: 28415516 # Airlock's real deployment block (2026-08-07, on-chain confirmed) — see §2 OQ1
    contracts:
      - name: Airlock
        address:
          - "0x660eAaEdEBc968f8f3694354FA8EC0b4c5Ba8D12"
      - name: PoolManager
        address:
          - "0x498581fF718922c3f8e6A244956aF099B2652b2b"
      - name: StreamableFeesLockerV2
        address:
          - "0xce3212e6536f33cd6fbfee265224131353ca3d47"
      - name: Clanker
        address:
          - "0xE85A59c628F7d27878ACeB4bf3b35733630083a9"
      - name: ClankerFeeLocker
        address:
          - "0xF3622742b1E446D92e45E22923Ef11C2fcD55D68"

  # Robinhood Chain (4663) intentionally omitted — see header note. Splice
  # in Module 3's real, current chain block here once produced; do not
  # reconstruct it from either of the two stale copies seen so far. Clanker
  # is NOT added here even when Robinhood is spliced back in — confirmed
  # not deployed on Robinhood Chain, see the Module 4 header note above.
